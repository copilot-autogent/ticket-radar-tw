name: Multi-source monitor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Availability threshold (positive remaining tickets)"
        required: false
        default: "1"
permissions:
  contents: write
  issues: write
concurrency:
  group: ticket-radar-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe Ticket Plus public paths
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const urls = [
            ["ordinary", "https://apis.ticketplus.com.tw/config/api/v1/get?eventId=e000001508&sessionId=s000002229,s000002230"],
            ["lottery", "https://apis.ticketplus.com.tw/config/api/v1/getS3?path=event/6c3d8c24e0f00c9c84777615c001bebe/event.json"]
          ];
          const variants = [
            ["default", { accept: "application/json,text/html" }],
            ["descriptive", { accept: "application/json,text/html", "user-agent": "ticket-radar-tw public monitor/1.0" }]
          ];
          for (const [kind, url] of urls) {
            for (const [label, headers] of variants) {
              const response = await fetch(url, { headers, redirect: "follow" });
              const body = await response.text();
              const digest = crypto.createHash("sha256").update(body).digest("hex").slice(0, 16);
              console.log(JSON.stringify({ kind, variant: label, status: response.status, redirected: response.url !== url, contentType: response.headers.get("content-type"), bytes: Buffer.byteLength(body), digest }));
            }
          }
          NODE
      - name: Poll public OPENTIX and UDN pages
        env:
          AVAILABILITY_THRESHOLD: ${{ inputs.threshold || '1' }}
          OPENTIX_ISSUE_NUMBER: "3"
          UDN_PERFORMANCE_URL: "https://tickets.udnfunlife.com/Application/UTK02/UTK0204_.aspx?PERFORMANCE_ID=P1AFIPX7&PRODUCT_ID=P1AEBJG5"
          TICKET_PLUS_ORDINARY_API_URL: "https://apis.ticketplus.com.tw/config/api/v1/get?eventId=e000001508&sessionId=s000002229,s000002230"
          TICKET_PLUS_LOTTERY_URL: "https://apis.ticketplus.com.tw/config/api/v1/getS3?path=event/6c3d8c24e0f00c9c84777615c001bebe/event.json"
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run monitor
      - name: Commit durable state
        run: |
          git add generated public
          if git diff --cached --quiet; then exit 0; fi
          git stash push --include-untracked -m "monitor state before rebase"
          git fetch origin
          git rebase "origin/${GITHUB_REF_NAME}"
          git stash apply
          git add generated public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update multi-source monitor state" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git stash drop
          for attempt in 1 2 3; do git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; git fetch origin && git rebase "origin/${GITHUB_REF_NAME}"; done
          exit 1
