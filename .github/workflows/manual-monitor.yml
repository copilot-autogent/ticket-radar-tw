name: Multi-source monitor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Availability threshold (positive remaining tickets)"
        required: false
        default: "1"
permissions:
  contents: write
  issues: write
concurrency:
  group: ticket-radar-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Poll public OPENTIX and UDN pages
        env:
          AVAILABILITY_THRESHOLD: ${{ inputs.threshold || '1' }}
          OPENTIX_ISSUE_NUMBER: "3"
          UDN_PERFORMANCE_URL: "https://tickets.udnfunlife.com/Application/UTK02/UTK0204_.aspx?PERFORMANCE_ID=P1AFIPX7&PRODUCT_ID=P1AEBJG5"
          TICKET_PLUS_ORDINARY_API_URL: "https://ticketplus.com.tw/activity/df31f9384cf60a3110dbf9607e780a1b.json"
          TICKET_PLUS_LOTTERY_URL: "https://ticketplus.com.tw/activity/6c3d8c24e0f00c9c84777615c001bebe"
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run monitor
      - name: Commit durable state
        run: |
          git add generated public
          if git diff --cached --quiet; then exit 0; fi
          git stash push --include-untracked -m "monitor state before rebase"
          git fetch origin
          git rebase "origin/${GITHUB_REF_NAME}"
          git stash apply
          git add generated public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update multi-source monitor state" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git stash drop
          for attempt in 1 2 3; do git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; git fetch origin && git rebase "origin/${GITHUB_REF_NAME}"; done
          exit 1
