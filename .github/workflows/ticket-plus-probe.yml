name: Ticket Plus public probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe documented public paths
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const urls = [
            ["ordinary", "https://apis.ticketplus.com.tw/config/api/v1/get?eventId=e000001508&sessionId=s000002229,s000002230"],
            ["lottery", "https://apis.ticketplus.com.tw/config/api/v1/getS3?path=event/6c3d8c24e0f00c9c84777615c001bebe/event.json"]
          ];
          const variants = [
            ["default", { accept: "application/json,text/html" }],
            ["descriptive", { accept: "application/json,text/html", "user-agent": "ticket-radar-tw public monitor/1.0" }]
          ];
          for (const [kind, url] of urls) {
            for (const [label, headers] of variants) {
              const response = await fetch(url, { headers, redirect: "follow" });
              const body = await response.text();
              const digest = crypto.createHash("sha256").update(body).digest("hex").slice(0, 16);
              console.log(JSON.stringify({ kind, variant: label, status: response.status, redirected: response.url !== url, contentType: response.headers.get("content-type"), bytes: Buffer.byteLength(body), digest }));
            }
          }
          NODE
